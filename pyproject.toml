[project]
name = "brain-tumor-detection"
version = "0.1.0"
description = "Brain Tumor Slice-Level Detection with Deep Learning and XAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grad-cam>=1.4.0",
    "ipykernel>=6.23.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "lightning>=2.0.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.7.0",
    "nibabel>=5.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.14.0",
    "pymupdf>=1.26.7",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "simpleitk>=2.2.0",
    "tensorboard>=2.13.0",
    "timm>=0.9.0",
    "torch>=2.0.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
where = ["src"]
